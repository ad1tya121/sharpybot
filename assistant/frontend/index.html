<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const API_BASE = "http://localhost:8000";
const FILES = ['a','b','c','d','e','f','g','h'];
const PLAYER_ID = 1; // single-player demo; extend later for multiple accounts

const PIECE_GLYPH = {
  wK:'\u2654', wQ:'\u2655', wR:'\u2656', wB:'\u2657', wN:'\u2658', wP:'\u2659',
  bK:'\u265A', bQ:'\u265B', bR:'\u265C', bB:'\u265D', bN:'\u265E', bP:'\u265F'
};

const QUALITY_COLOR = {
  Brilliant:'#5c86a0', Best:'#5f7a3c', Good:'#5f7a3c',
  Inaccuracy:'#c1852f', Mistake:'#b5432b', Blunder:'#7a1f10'
};

const SLIDER_META = [
  {key:0, label:'Difficulty', icon:'\u265F'},
  {key:1, label:'Aggression Bias', icon:'\u2694'},
  {key:2, label:'Tactical Complexity', icon:'\u265E'},
  {key:3, label:'Endgame Emphasis', icon:'\u265A'},
  {key:4, label:'Contempt', icon:'\u2620'},
];

function evalDescription(cp, mate){
  if(mate) return (cp>=0?'White':'Black')+' has a forced mate';
  const abs = Math.abs(cp);
  const side = cp>=0 ? 'White' : 'Black';
  if(abs<50) return 'Equal position';
  if(abs<150) return side+' is slightly better';
  if(abs<400) return side+' is clearly better';
  return side+' is winning';
}

const LICHESS_THEME_MAP = {
  hanging_piece: 'https://lichess.org/training/hangingPiece',
  missed_fork: 'https://lichess.org/training/fork',
  king_safety_collapse: 'https://lichess.org/training/exposedKing',
  back_rank_weakness: 'https://lichess.org/training/backRankMate',
  missed_pin_skewer: 'https://lichess.org/training/pin',
  time_pressure_blunder: 'https://lichess.org/training/master',
  defensive_inaccuracy: 'https://lichess.org/training/defensiveMove',
  offensive_miss: 'https://lichess.org/training/advantage',
  tactical_blindness: 'https://lichess.org/training/middlegame',
  positional_misjudgment: 'https://lichess.org/training/quietMove',
};

const MOTIF_LABELS = {
  hanging_piece:'Hanging piece', missed_fork:'Missed fork', king_safety_collapse:'King safety collapse',
  back_rank_weakness:'Back-rank weakness', missed_pin_skewer:'Missed pin/skewer',
  time_pressure_blunder:'Time-pressure blunder', defensive_inaccuracy:'Defensive inaccuracy',
  offensive_miss:'Offensive miss', tactical_blindness:'Tactical blindness',
  positional_misjudgment:'Positional misjudgment'
};

const HOMEWORK_TIPS = {
  hanging_piece:'Before every move, scan for any of your pieces that are undefended.',
  missed_fork:'Practice knight-fork puzzles - look for forks 1-2 moves before they happen.',
  king_safety_collapse:'Review games where your king got exposed; castle earlier next time.',
  back_rank_weakness:'Make a habit of giving your king a luft square in the endgame.',
  missed_pin_skewer:'Study classic pin/skewer patterns from master games.',
  time_pressure_blunder:'Slow down in complex positions - budget your clock earlier.',
  defensive_inaccuracy:'Work through defensive-resource puzzles from worse positions.',
  offensive_miss:'Look one move further for a stronger continuation before playing "good enough".',
  tactical_blindness:'Do daily tactics puzzles to sharpen pattern recognition.',
  positional_misjudgment:'Study pawn-structure and piece-placement principles.'
};

function squareId(color, type, square){ return color+type+square; }

function initialPieces(){
  const back = ['R','N','B','Q','K','B','N','R'];
  const pieces = [];
  FILES.forEach((f,i)=>{
    pieces.push({id:squareId('w',back[i],f+'1'), color:'w', type:back[i], square:f+'1'});
    pieces.push({id:squareId('w','P',f+'2'), color:'w', type:'P', square:f+'2'});
    pieces.push({id:squareId('b','P',f+'7'), color:'b', type:'P', square:f+'7'});
    pieces.push({id:squareId('b',back[i],f+'8'), color:'b', type:back[i], square:f+'8'});
  });
  return pieces;
}

function boardFromChessJs(game){
  const board = game.board();
  const pieces = [];
  for(let row=0; row<8; row++){
    for(let col=0; col<8; col++){
      const cell = board[row][col];
      if(!cell) continue;
      const square = FILES[col] + (8-row);
      pieces.push({id:squareId(cell.color, cell.type.toUpperCase(), square)+'_'+row+'_'+col,
        color:cell.color, type:cell.type.toUpperCase(), square});
    }
  }
  return pieces;
}

function applyMoveToDisplay(pieces, mv){
  let next = pieces.slice();
  // remove normal capture target
  next = next.filter(p => p.square !== mv.to || p.square === mv.from);
  // en passant: captured pawn sits on a different square than `to`
  if(mv.flags && mv.flags.indexOf('e') !== -1){
    const capturedSquare = mv.to[0] + mv.from[1];
    next = next.filter(p => p.square !== capturedSquare);
  }
  // move the piece itself
  next = next.map(p => {
    if(p.square === mv.from && p.color === mv.color){
      return {...p, square: mv.to, type: mv.promotion ? mv.promotion.toUpperCase() : p.type};
    }
    return p;
  });
  // castling: also relocate the rook
  if(mv.flags && mv.flags.indexOf('k') !== -1){
    const rank = mv.color === 'w' ? '1' : '8';
    next = next.map(p => p.square === 'h'+rank && p.type==='R' && p.color===mv.color ? {...p, square:'f'+rank} : p);
  }
  if(mv.flags && mv.flags.indexOf('q') !== -1){
    const rank = mv.color === 'w' ? '1' : '8';
    next = next.map(p => p.square === 'a'+rank && p.type==='R' && p.color===mv.color ? {...p, square:'d'+rank} : p);
  }
  return next;
}

function squareToPct(square){
  const col = FILES.indexOf(square[0]);
  const row = 8 - parseInt(square[1], 10);
  return { left: (col*12.5)+'%', top: (row*12.5)+'%' };
}

function ResultBadge({result}){
  const isWin = result === 1;
  const isDraw = result === 0.5;
  const ring = isWin ? '#8fae5c' : isDraw ? '#cda254' : '#c1614a';
  const ribbon = isWin ? '#5f7a3c' : isDraw ? '#9c6633' : '#7a1f10';
  const text = isWin ? 'YOU WIN' : isDraw ? 'DRAW' : 'YOU LOSE';
  return (
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke={ring} strokeWidth="6" strokeDasharray="4 5" opacity="0.85"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke={ring} strokeWidth="2.5" opacity="0.55"/>
      <circle cx="100" cy="100" r="66" fill="none" stroke={ring} strokeWidth="1.5" strokeDasharray="1 3" opacity="0.4"/>
      <text x="100" y="44" textAnchor="middle" fontFamily="Fraunces, serif" fontSize="18" fill={ring}>&#9733; &#9733; &#9733;</text>
      <g transform="rotate(-4 100 100)">
        <polygon points="14,86 0,100 14,124 26,124 26,86" fill={ribbon} opacity="0.9"/>
        <polygon points="186,86 200,100 186,124 174,124 174,86" fill={ribbon} opacity="0.9"/>
        <rect x="18" y="86" width="164" height="34" fill={ribbon}/>
        <rect x="18" y="86" width="164" height="34" fill="none" stroke="rgba(0,0,0,0.25)" strokeWidth="1"/>
        <text x="100" y="109" textAnchor="middle" fontFamily="Fraunces, serif" fontWeight="700"
          fontSize="21" fill="#f3e6c9" letterSpacing="2">{text}</text>
      </g>
      <text x="100" y="164" textAnchor="middle" fontFamily="Fraunces, serif" fontSize="18" fill={ring}>&#9733; &#9733; &#9733;</text>
    </svg>
  );
}

function App(){
  const gameRef = useRef(new Chess());
  const [pieces, setPieces] = useState(initialPieces());
  const [selected, setSelected] = useState(null);
  const [legalTargets, setLegalTargets] = useState([]);
  const [lastMove, setLastMove] = useState(null);
  const [dragging, setDragging] = useState(null); // {id, x, y}
  const [history, setHistory] = useState([]); // {san, uci}
  const [engineThinking, setEngineThinking] = useState(false);
  const [gameOver, setGameOver] = useState(false);
  const [gameResult, setGameResult] = useState(null);   // 1.0 win / 0.0 loss / 0.5 draw (player's side)
  const [gameOverReason, setGameOverReason] = useState('');
  const [analysis, setAnalysis] = useState(null);      // NEVER reset to null after first value
  const [lastError, setLastError] = useState(null);
  const [quotaNotice, setQuotaNotice] = useState(null);
  const [coachFull, setCoachFull] = useState('');
  const [coachShown, setCoachShown] = useState('');
  const [coachLoading, setCoachLoading] = useState(false);
  const [coachSource, setCoachSource] = useState(null); // 'gemini' | 'quota_exceeded' | 'error' | null
  const [chat, setChat] = useState([]);
  const [chatText, setChatText] = useState('');
  const [fenInput, setFenInput] = useState('');
  const [pgnInput, setPgnInput] = useState('');
  const [showProfile, setShowProfile] = useState(false);
  const [showHistoryList, setShowHistoryList] = useState(false);
  const [gamesList, setGamesList] = useState([]);
  const [reviewGame, setReviewGame] = useState(null);
  const [reviewIndex, setReviewIndex] = useState(null);
  const [profileData, setProfileData] = useState(null);
  const [engineState, setEngineState] = useState(null);
  const [evalCp, setEvalCp] = useState(0);
  const [evalMate, setEvalMate] = useState(false);
  const [viewingIndex, setViewingIndex] = useState(null); // null = live position; number = previewing that ply
  const [timerEnabled, setTimerEnabled] = useState(true);
  const [liveElapsed, setLiveElapsed] = useState(0);
  const [showPositionTools, setShowPositionTools] = useState(false);

  const boardRef = useRef(null);
  const moveStartTime = useRef(Date.now());
  const dragInfo = useRef(null); // {id,color,type,square,pointerId,startX,startY}

  const game = gameRef.current;
  

  // ---------- typewriter effect for coach note ----------
  useEffect(()=>{
    if(!coachFull){ setCoachShown(''); return; }
    setCoachShown('');
    let i = 0;
    const totalMs = 350;
    const tickMs = 16;
    const step = Math.max(1, Math.ceil(coachFull.length / (totalMs / tickMs)));
    const iv = setInterval(()=>{
      i += step;
      setCoachShown(coachFull.slice(0, i));
      if(i >= coachFull.length) clearInterval(iv);
    }, tickMs);
    return ()=>clearInterval(iv);
  }, [coachFull]);

  const uciHistory = useMemo(()=>history.map(h=>h.uci), [history]);

  const reviewPieces = useMemo(()=>{
    if(!reviewGame || !Array.isArray(reviewGame.moves)) return null;
    try {
      const scratch = new Chess();
      const upto = reviewIndex===null ? reviewGame.moves.length-1 : reviewIndex;     
      for(let i=0;i<=upto;i++){
        const u = reviewGame.moves[i];
        if(!u || typeof u !== 'string' || u.length < 4) break;
        const mv = scratch.move({from:u.slice(0,2), to:u.slice(2,4), promotion:u.slice(4,5)||'q'});
        if(!mv) break; // stop replaying rather than crash on a bad/illegal move
      }
      return boardFromChessJs(scratch);
    } catch(err){
      console.error('[reviewPieces] failed to replay game', reviewGame.game_id, err);
      return boardFromChessJs(new Chess()); // fall back to starting position instead of crashing
    }
  }, [reviewGame, reviewIndex]);
  const displayPieces = reviewGame ? (reviewPieces || []) : pieces;

  function legalTargetsFor(square){
    const moves = game.moves({square, verbose:true});
    return moves.map(m=>({square:m.to, capture: !!m.captured}));
  }

  function fetchCoachNote(prompt, fallback){
    const myId = ++coachRequestId.current;
    setCoachLoading(true);
    setCoachSource(null);
    fetch(API_BASE+'/coach-note', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({coaching_prompt: prompt, fallback_note: fallback})
    }).then(r=>r.json()).then(d=>{
      if(myId !== coachRequestId.current) return; // a newer move's note already superseded this one
      setCoachFull(d.ai_note || fallback || '');
      setCoachSource(d.source || null);
      setCoachLoading(false);
      if(d.source === 'quota_exceeded'){
        setQuotaNotice('Daily AI coaching quota reached - showing engine-only notes until it resets. Move analysis, eval bar and the engine\'s replies are unaffected.');
      }
    }).catch(()=>{
      if(myId !== coachRequestId.current) return;
      setCoachFull(fallback || '');
      setCoachSource('error');
      setCoachLoading(false);
    });
  }

  function callAnalyze(movesList, timeSpent){
    setLastError(null);   // clear any stale banner from a previous move the instant a new one starts
    setEngineThinking(true);
    fetch(API_BASE+'/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({moves: movesList, time_spent_seconds: timeSpent})
    }).then(r=>r.json()).then(data=>{
      if(!data.success){
        console.error('[/analyze] backend returned failure:', data);
        setLastError(data.ai_note || 'The engine reported a failure - check the backend terminal.');
        setEngineThinking(false);
        return;
      }
      setLastError(null);
      // eval bar always shown from White's perspective
      let whiteCp = data.mover_is_white ? data.eval_cp : -data.eval_cp;
      setEvalMate(Math.abs(data.eval_cp) >= 29000);
      setEvalCp(whiteCp);
      setAnalysis(data);              // overwrite only now that we truly have new data
      // Board, eval bar and engine's reply move never wait on the AI note -
      // that call happens separately below so it can take its time (or fail
      // on quota) without freezing the UI.
      setTimeout(()=>{
        if(data.engine_move){ playEngineMove(data.engine_move, movesList); }
        setEngineThinking(false);
      }, 700);
      setCoachFull(data.fallback_note || '');   // shown instantly - no wait for Gemini
      setCoachSource('fallback');
      fetchCoachNote(data.coaching_prompt, data.fallback_note);
    }).catch(err=>{
      console.error('[/analyze] fetch failed - is the backend running at '+API_BASE+' ?', err);
      setLastError('Could not reach the backend at '+API_BASE+'. Is it running?');
      setEngineThinking(false);
    });
  }

  function playEngineMove(uci, movesSoFar){
    const from = uci.slice(0,2), to = uci.slice(2,4), promo = uci.length>4 ? uci.slice(4,5) : undefined;
    const mv = game.move({from, to, promotion: promo || 'q'});
    if(!mv) return;
    setPieces(p => applyMoveToDisplay(p, mv));
    setLastMove({from, to});
    const uciMove = from+to+(mv.promotion||'');
    setHistory(h => [...h, {san: mv.san, uci: uciMove}]);
    moveStartTime.current = Date.now();
    checkGameOver(movesSoFar ? [...movesSoFar, uciMove] : undefined);
  }

  function attemptMove(from, to){
    if(engineThinking || gameOver || viewingIndex !== null) return;
    const piece = game.get(from);
    let promotion = undefined;
    if(piece && piece.type === 'p' && (to[1]==='8' || to[1]==='1')) promotion = 'q';
    const mv = game.move({from, to, promotion});
    setSelected(null); setLegalTargets([]);
    if(!mv) return;
    setPieces(p => applyMoveToDisplay(p, mv));
    setLastMove({from, to});
    const uci = from+to+(mv.promotion||'');
    const newHistory = [...history, {san: mv.san, uci}];
    setHistory(newHistory);
    // If the timer is off, we still need SOME value for time_spent_seconds,
    // but a real elapsed time would let the engine flag time-pressure
    // blunders the player never asked to be tracked for - so send a large
    // number instead, which keeps that motif from firing.
    const timeSpent = timerEnabled ? (Date.now() - moveStartTime.current) / 1000 : 999;
    moveStartTime.current = Date.now();
    const overNow = checkGameOver(newHistory.map(h=>h.uci));
    if(!overNow){
      callAnalyze(newHistory.map(h=>h.uci), timeSpent);
    }
  }

  function checkGameOver(finalMoves){
    if(game.game_over()){
      setGameOver(true);
      let result = 0.5;
      let reason = '50-move rule';
      if(game.in_checkmate()){
        // side whose turn it is now just got mated -> the OTHER side won
        result = game.turn() === 'w' ? 0.0 : 1.0;
        reason = 'Checkmate';
      } else if(game.in_stalemate()){
        reason = 'Stalemate';
      } else if(game.insufficient_material()){
        reason = 'Insufficient material';
      } else if(game.in_threefold_repetition()){
        reason = 'Threefold repetition';
      }
      setGameResult(result);
      setGameOverReason(reason);
      endgame(result, finalMoves);
      return true;
    }
    return false;
  }

  function resetGame(){
    gameRef.current = new Chess();
    setPieces(initialPieces());
    setSelected(null); setLegalTargets([]); setLastMove(null);
    setDragging(null);
    setHistory([]);
    setEngineThinking(false);
    setGameOver(false); setGameResult(null); setGameOverReason('');
    setAnalysis(null);
    setLastError(null); setQuotaNotice(null);
    setCoachFull(''); setCoachSource(null); setCoachLoading(false);
    setEvalCp(0); setEvalMate(false);
    setViewingIndex(null);
    moveStartTime.current = Date.now();
  }

  function fetchEngineState(){
    fetch(API_BASE+'/profile/'+PLAYER_ID).then(r=>r.json()).then(setEngineState).catch(()=>{});
  }

  useEffect(()=>{ fetchEngineState(); }, []);

  function endgame(result, finalMoves){
    const moves = finalMoves || (uciHistory.length? uciHistory : history.map(h=>h.uci));
    fetch(API_BASE+'/endgame', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({moves, player_id: PLAYER_ID, result})
    }).then(r=>r.json()).then(d=>{
      fetchEngineState();
      if(d.success === false){
        console.error('[/endgame] backend returned failure:', d);
        setLastError('Saving the finished game failed: '+(d.error||'unknown error')+' - check the backend terminal.');
      }
    }).catch(err=>{
      console.error('[/endgame] fetch failed', err);
      setLastError('Could not save the finished game to your history - the backend may be unreachable.');
    });
  }

  // ---------- pointer-based click + drag-and-drop ----------
  function onSquarePointerDown(e, square){
    if(engineThinking || gameOver || viewingIndex !== null || reviewGame) return;
    const piece = pieces.find(p=>p.square===square);
    if(selected && legalTargets.some(t=>t.square===square)){
      attemptMove(selected, square);
      return;
    }
    if(piece && ((piece.color==='w')===(game.turn()==='w'))){
      dragInfo.current = {square, startX:e.clientX, startY:e.clientY, dragging:false, pieceId:piece.id};
      setSelected(square);
      setLegalTargets(legalTargetsFor(square));
    } else {
      setSelected(null); setLegalTargets([]);
    }
  }

  useEffect(()=>{
    function onMove(e){
      if(!dragInfo.current) return;
      const dx = e.clientX - dragInfo.current.startX;
      const dy = e.clientY - dragInfo.current.startY;
      if(!dragInfo.current.dragging && Math.hypot(dx,dy) > 6){
        dragInfo.current.dragging = true;
      }
      if(dragInfo.current.dragging){
        const rect = boardRef.current.getBoundingClientRect();
        setDragging({id: dragInfo.current.pieceId, x: e.clientX-rect.left, y: e.clientY-rect.top});
      }
    }
    function onUp(e){
      if(!dragInfo.current) return;
      if(dragInfo.current.dragging && boardRef.current){
        const rect = boardRef.current.getBoundingClientRect();
        const sq = rect.width/8;
        let col = Math.floor((e.clientX-rect.left)/sq);
        let row = Math.floor((e.clientY-rect.top)/sq);
        col = Math.max(0, Math.min(7,col)); row = Math.max(0, Math.min(7,row));
        const to = FILES[col] + (8-row);
        attemptMove(dragInfo.current.square, to);
      }
      dragInfo.current = null;
      setDragging(null);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return ()=>{ window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  }, [pieces, selected, legalTargets, engineThinking, gameOver, history]);

  function jumpToMove(index){
    // Rebuild position up to that move using the recorded uci history (read-only preview via a scratch game)
    const scratch = new Chess();
    for(let i=0;i<=index;i++){
      const u = history[i].uci;
      scratch.move({from:u.slice(0,2), to:u.slice(2,4), promotion:u.slice(4,5)||'q'});
    }
    setPieces(boardFromChessJs(scratch));
    setLastMove({from: history[index].uci.slice(0,2), to: history[index].uci.slice(2,4)});
    setViewingIndex(index);
  }

  function backToCurrentPosition(){
    setPieces(boardFromChessJs(game));
    if(history.length){
      const last = history[history.length-1].uci;
      setLastMove({from:last.slice(0,2), to:last.slice(2,4)});
    }
    setViewingIndex(null);
  }

  // ---------- live move-clock ticker (display only; only runs when the timer is enabled) ----------
  useEffect(()=>{
    if(!timerEnabled || engineThinking || gameOver || viewingIndex !== null) return;
    const iv = setInterval(()=>{
      setLiveElapsed(Math.floor((Date.now() - moveStartTime.current)/1000));
    }, 250);
    return ()=>clearInterval(iv);
  }, [timerEnabled, engineThinking, gameOver, viewingIndex, history.length]);

  useEffect(()=>{ setLiveElapsed(0); }, [history.length]);

  function loadFen(){
    const ok = game.load(fenInput.trim());
    if(!ok){ alert('Invalid FEN'); return; }
    setPieces(boardFromChessJs(game));
    setHistory([]); setSelected(null); setLegalTargets([]); setLastMove(null); setGameOver(false);
    moveStartTime.current = Date.now();
  }

  function loadPgn(){
    const ok = game.load_pgn(pgnInput.trim());
    if(!ok){ alert('Invalid PGN'); return; }
    const verboseHist = game.history({verbose:true});
    const newHistory = verboseHist.map(m => ({san:m.san, uci: m.from+m.to+(m.promotion||'')}));
    setHistory(newHistory);
    setPieces(boardFromChessJs(game));
    setSelected(null); setLegalTargets([]); setGameOver(game.game_over());
    moveStartTime.current = Date.now();
  }

  function sendChat(){
    if(!chatText.trim()) return;
    const msg = chatText.trim();
    setChat(c => [...c, {role:'user', text: msg}]);
    setChatText('');
    fetch(API_BASE+'/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, fen: game.fen()})
    }).then(r=>r.json()).then(d=>{
      setChat(c => [...c, {role:'coach', text: d.reply}]);
    }).catch(()=>{
      setChat(c => [...c, {role:'coach', text:'(could not reach the coach right now)'}]);
    });
  }

  function openProfile(){
    setShowProfile(true);
    fetch(API_BASE+'/profile/'+PLAYER_ID).then(r=>r.json()).then(setProfileData).catch(()=>{});
    fetch(API_BASE+'/games/'+PLAYER_ID).then(r=>r.json()).then(d=>setGamesList(d.games||[])).catch(()=>{});
  }

  function openHistoryList(){
    setShowHistoryList(true);
    fetch(API_BASE+'/games/'+PLAYER_ID).then(r=>r.json()).then(d=>setGamesList(d.games||[])).catch(()=>{});
  }

  function openGameReview(gameId){
    fetch(API_BASE+'/game/'+gameId).then(r=>r.json()).then(d=>{
      if(!d.success){
        setLastError('Could not load game #'+gameId+': '+(d.error||'unknown error'));
        return;
      }
      setReviewGame(d.game);
      setReviewIndex(null);
      setShowProfile(false);
      setShowHistoryList(false);
    }).catch(err=>{
      console.error('[openGameReview] fetch failed', err);
      setLastError('Could not reach the backend to load that game.');
    });
  }

  function closeReview(){
    setReviewGame(null);
    setReviewIndex(null);
  }

  const evalPct = evalMate
    ? (evalCp > 0 ? 100 : 0)
    : Math.max(4, Math.min(96, 50 + (evalCp/1200)*50));

  const turnLabel = gameOver
    ? 'Game Over'
    : engineThinking
      ? "Engine is thinking\u2026"
      : ('Your turn \u2014 ' + (game.turn()==='w' ? 'White' : 'Black'));

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">&#9812;</div>
          <div>
            <h1>Oakwood Chess Coach</h1>
            <small>Your Personalized Analysis Engine</small>
          </div>
        </div>
        <div style={{display:'flex', gap:16, alignItems:'center'}}>
          <label style={{
            display:'flex', alignItems:'center', gap:7, fontSize:12, color:'var(--cream)',
            cursor: history.length===0 ? 'pointer' : 'not-allowed', opacity: history.length===0 ? 1 : 0.55
          }} title={history.length===0 ? 'Track how long you spend on each move' : 'Timer setting locks once the game starts'}>
            <input type="checkbox" checked={timerEnabled} disabled={history.length>0}
              onChange={e=>setTimerEnabled(e.target.checked)} />
            Move timer
          </label>
          {timerEnabled && history.length>0 && !gameOver && (
            <span style={{fontSize:12, color:'var(--brass-bright)', fontFamily:'monospace', minWidth:52}}>
              &#9200; {liveElapsed}s
            </span>
          )}
          <button className="btn btn-ghost" onClick={resetGame}>New Game</button>
          <button className="btn btn-ghost" onClick={openProfile}>My Profile</button>
        </div>
      </div>

      {lastError && (
        <div style={{
          background:'#5c2016', border:'1px solid var(--danger)', color:'#fbe4dd',
          padding:'10px 22px', fontSize:13, display:'flex', justifyContent:'space-between', alignItems:'center'
        }}>
          <span>&#9888; {lastError}</span>
          <button className="btn btn-ghost" style={{padding:'3px 10px', fontSize:12}} onClick={()=>setLastError(null)}>Dismiss</button>
        </div>
      )}

      {quotaNotice && (
        <div style={{
          background:'#4a3a16', border:'1px solid var(--warn)', color:'#f3e6c9',
          padding:'10px 22px', fontSize:13, display:'flex', justifyContent:'space-between', alignItems:'center'
        }}>
          <span>&#9432; {quotaNotice}</span>
          <button className="btn btn-ghost" style={{padding:'3px 10px', fontSize:12}} onClick={()=>setQuotaNotice(null)}>Dismiss</button>
        </div>
      )}

      <div style={{display:'flex', justifyContent:'center', padding:'5px 0 0'}}>
        <span style={{
          background:'linear-gradient(180deg, var(--wood-700), var(--wood-800))',
          border:'1px solid var(--brass)', borderRadius:20,
          padding:'7px 22px', fontSize:13, fontWeight:800, letterSpacing:0.4,
          color: gameOver ? '#e0a06a' : 'var(--brass-bright)',
          boxShadow:'0 2px 8px rgba(0,0,0,0.3)'
        }}>
          {turnLabel}
        </span>
      </div>

      <div className="layout">
        {reviewGame && (
          <div style={{gridColumn:'1 / -1', display:'flex', justifyContent:'center', marginBottom:-4}}>
            <div style={{
              background:'var(--wood-700)', border:'1px solid var(--brass)', borderRadius:20,
              padding:'6px 18px', fontSize:13, display:'flex', alignItems:'center', gap:12
            }}>
              <span>Reviewing Game #{reviewGame.game_id}</span>
              <button className="btn" style={{padding:'3px 10px', fontSize:11}} onClick={closeReview}>Back to Live Game</button>
            </div>
          </div>
        )}
        {/* LEFT COLUMN */}
        <div className="col left">
          <div className="panel">
            <h3>Move History <span className="badge">plies: {reviewGame ? reviewGame.moves.length : history.length}</span></h3>
            {viewingIndex !== null && (
              <div style={{
                display:'flex', alignItems:'center', justifyContent:'space-between',
                background:'var(--wood-900)', border:'1px solid var(--brass)', borderRadius:6,
                padding:'6px 10px', marginBottom:10, fontSize:12
              }}>
                <span>Viewing move {viewingIndex+1}</span>
                <button className="btn" style={{padding:'4px 10px', fontSize:11}} onClick={backToCurrentPosition}>Current Position</button>
              </div>
            )}
            {reviewGame ? (
              <React.Fragment>
                <div style={{marginBottom:8}}>
                  <span style={{fontSize:11, textTransform:'uppercase', color:'var(--brass)'}}>Total moves</span>
                  <div className="total-moves-tracker">{Math.ceil(reviewGame.moves.length/2)}</div>
                </div>
                <div className="move-history">
                  {reviewGame.moves.map((u,i)=>{
                    const detail = reviewGame.moves_detail && reviewGame.moves_detail[i];
                    const isCurrent = reviewIndex===null ? (i===reviewGame.moves.length-1) : (i===reviewIndex);
                    return (
                      <div className="move-row" key={i}
                        style={{background: isCurrent ? 'var(--wood-700)' : 'transparent', cursor:'pointer'}}
                        onClick={()=>setReviewIndex(i)}>
                        <span className="move-num">{i+1}.</span>
                        <span className="move-san">{detail ? detail.san : u}</span>
                        {detail && <span className="quality-pill" style={{background: QUALITY_COLOR[detail.quality]||'var(--wood-700)', fontSize:10, marginLeft:6}}>{detail.quality}</span>}
                      </div>
                    );
                  })}
                </div>
                <div style={{marginTop:8}}>
                  <button className="btn" style={{fontSize:11, padding:'4px 10px'}} onClick={()=>setReviewIndex(null)}>Jump to final position</button>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{marginBottom:8}}>
                  <span style={{fontSize:11, textTransform:'uppercase', color:'var(--brass)'}}>Total moves</span>
                  <div className="total-moves-tracker">{Math.ceil(history.length/2)}</div>
                </div>
                <div className="move-history">
                  {history.length===0 && <div style={{fontSize:12, color:'var(--brass)'}}>No moves yet</div>}
                  {Array.from({length: Math.ceil(history.length/2)}).map((_,i)=>{
                    const w = history[i*2], b = history[i*2+1];
                    return (
                      <div className="move-row" key={i}>
                        <span className="move-num">{i+1}.</span>
                        {w && <span className="move-san" onClick={()=>jumpToMove(i*2)}>{w.san}</span>}
                        {b && <span className="move-san" onClick={()=>jumpToMove(i*2+1)}>{b.san}</span>}
                      </div>
                    );
                  })}
                </div>
              </React.Fragment>
            )}
          </div>

          <div className="panel">
            <h3>Coach {coachLoading && <span className="thinking-dot"></span>}</h3>
            <div className="coach-note">
              {coachShown || (analysis ? (coachLoading ? 'Thinking...' : '') : "Make a move to get coaching...")}
            </div>
            {coachSource === 'quota_exceeded' && !coachLoading && (
              <div style={{fontSize:11, color:'var(--brass)', marginTop:6}}>(engine-only note - AI quota reached today)</div>
            )}
          </div>

          <div className="panel">
            <h3>Ask Coach</h3>
            <div className="chat-log">
              {chat.length===0 && <div style={{fontSize:12, color:'var(--brass)'}}>Ask anything about your game...</div>}
              {chat.map((m,i)=>(
                <div key={i} className={"chat-msg "+m.role}>{m.text}</div>
              ))}
            </div>
            <div className="chat-input-row">
              <input placeholder="Ask your coach..." value={chatText}
                onChange={e=>setChatText(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') sendChat(); }} />
              <button className="btn" onClick={sendChat}>Send</button>
            </div>
          </div>

          <div className="panel" style={{padding: showPositionTools ? '10px 14px' : '8px 14px'}}>
            <h3 style={{marginBottom: showPositionTools ? 7 : 0, cursor:'pointer'}} onClick={()=>setShowPositionTools(s=>!s)}>
              Play a Position <span style={{fontSize:11}}>{showPositionTools ? '\u25B2' : '\u25BC'}</span>
            </h3>
            {showPositionTools && (
              <React.Fragment>
                <div className="io-row">
                  <input placeholder="Paste FEN..." value={fenInput} onChange={e=>setFenInput(e.target.value)} />
                  <button className="btn" onClick={loadFen}>Load</button>
                </div>
                <div className="io-row">
                  <textarea placeholder="Paste PGN..." value={pgnInput} onChange={e=>setPgnInput(e.target.value)} />
                  <button className="btn" onClick={loadPgn}>Load</button>
                </div>
                <div style={{fontSize:11, color:'var(--brass)'}}>Click a piece, or drag it, to move. Or use FEN/PGN above.</div>
              </React.Fragment>
            )}
          </div>
        </div>

        {/* CENTER: eval bar + board, sharing one wood frame */}
        <div className="board-zone">
          <div className="eval-bar-wrap">
            <span className="eval-label">{evalMate ? 'MATE' : (evalCp>=0?'+':'')+(evalCp/100).toFixed(2)}</span>
            <div className="eval-bar">
              <div className={"eval-fill"+(evalMate?" mate":"")} style={{height: evalPct+'%'}}></div>
            </div>
            <span className="eval-label">White / Black</span>
          </div>

          <div className="board-frame">
            <div className="corner tl"></div><div className="corner tr"></div>
            <div className="corner bl"></div><div className="corner br"></div>
            <div className="board" ref={boardRef}>
              {Array.from({length:8}).map((_,row)=>Array.from({length:8}).map((__,col)=>{
                const square = FILES[col]+(8-row);
                const light = (row+col)%2===0;
                const isSel = selected===square;
                const isLast = lastMove && (lastMove.from===square || lastMove.to===square);
                return (
                  <div key={square}
                    className={"square "+(light?"light":"dark")+(isSel?" selected":"")+(isLast?" last-move":"")}
                    style={{left:(col*12.5)+'%', top:(row*12.5)+'%'}}
                    onPointerDown={(e)=>onSquarePointerDown(e, square)}>
                    {col===0 && <span className="sq-coord rank">{8-row}</span>}
                    {row===7 && <span className="sq-coord file">{FILES[col]}</span>}
                  </div>
                );
              }))}

              {legalTargets.map(t=>{
                const pct = squareToPct(t.square);
                return <div key={t.square} className={"dot-target"+(t.capture?" capture":"")} style={pct}><div className="dot"></div></div>;
              })}

              {(displayPieces || []).map(p=>{
                const isDragged = dragging && dragging.id===p.id;
                const style = isDragged
                  ? {left:(dragging.x - (boardRef.current?boardRef.current.clientWidth/16:35)), top:(dragging.y - (boardRef.current?boardRef.current.clientHeight/16:35))}
                  : squareToPct(p.square);
                return (
                  <div key={p.id}
                    className={"piece "+(p.color==='w'?'white':'black')+(isDragged?" dragging":"")}
                    style={style}
                    onPointerDown={(e)=>onSquarePointerDown(e, p.square)}>
                    {PIECE_GLYPH[p.color+p.type]}
                  </div>
                );
              })}
              {gameOver && gameResult !== null && viewingIndex === null && !reviewGame && (
                <div className="result-overlay">
                  <div className="result-badge">
                    <ResultBadge result={gameResult}/>
                    <button className="btn result-newgame-btn" onClick={resetGame}>New Game</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* RIGHT COLUMN */}
        <div className="col right">
          <div className="panel">
            <h3>Evaluation</h3>
            <div style={{fontSize:30, fontWeight:800, color:'var(--brass-bright)', fontFamily:"'Fraunces', serif"}}>
              {evalMate ? 'MATE' : (evalCp>=0?'+':'')+(evalCp/100).toFixed(2)}
            </div>
            <div style={{fontSize:12, color:'var(--brass)'}}>{evalDescription(evalCp, evalMate)}</div>
          </div>

          <div className="panel">
            <h3>Move Analysis {engineThinking && <span className="thinking-dot"></span>}</h3>
            {reviewGame && (()=>{
              const idx = reviewIndex===null ? reviewGame.moves.length-1 : reviewIndex;
              const d = reviewGame.moves_detail && reviewGame.moves_detail[idx];
              if(!d) return <div style={{fontSize:12, color:'var(--brass)'}}>No detail saved for this move.</div>;
              return (
                <React.Fragment>
                  <div style={{marginBottom:8}}>
                    <span className="quality-pill" style={{background: QUALITY_COLOR[d.quality] || 'var(--wood-700)'}}>{d.quality}</span>
                    <span style={{marginLeft:8, fontSize:12, color:'var(--brass)'}}>move {d.move_number} &middot; {d.san}</span>
                  </div>
                  <div className="analysis-grid">
                    <div className="stat-box"><span className="label">CP Loss</span><span className="value">{d.cp_loss}</span></div>
                    <div className="stat-box"><span className="label">Ply</span><span className="value">{idx+1} / {reviewGame.moves.length}</span></div>
                  </div>
                  <div style={{marginBottom:10}}>
                    <span className="label" style={{fontSize:10, textTransform:'uppercase', color:'var(--brass)'}}>Motifs Triggered</span><br/>
                    {(!d.motifs || d.motifs.length===0) && <span style={{fontSize:12, color:'var(--brass)'}}>none</span>}
                    {d.motifs && d.motifs.map(m => <span key={m} className="motif-chip">{MOTIF_LABELS[m]||m}</span>)}
                  </div>
                  <span className="label" style={{fontSize:10, textTransform:'uppercase', color:'var(--brass)'}}>Coach's Note</span>
                  <div className="coach-note" style={{minHeight:0, marginTop:4}}>
                    {d.ai_note || <span style={{fontStyle:'normal', color:'var(--brass)'}}>No note recorded for this move.</span>}
                  </div>
                </React.Fragment>
              );
            })()}
            {!reviewGame && !analysis && <div style={{fontSize:12, color:'var(--brass)'}}>Play a move to see the breakdown.</div>}
            {!reviewGame && analysis && (
              <React.Fragment>
                <div style={{marginBottom:8}}>
                  <span className="quality-pill" style={{background: QUALITY_COLOR[analysis.quality] || 'var(--wood-700)'}}>{analysis.quality}</span>
                  <span style={{marginLeft:8, fontSize:12, color:'var(--brass)'}}>move {analysis.move_number} &middot; {analysis.san}</span>
                </div>
                <div className="analysis-grid">
                  <div className="stat-box"><span className="label">CP Loss</span><span className="value">{analysis.cp_loss}</span></div>
                  <div className="stat-box"><span className="label">Total Moves</span><span className="value">{analysis.total_moves}</span></div>
                  {analysis.is_top_engine_choice ? (
                    <div className="stat-box" style={{gridColumn:'1 / -1', background:'linear-gradient(180deg, #3a4a26, #2a3518)', borderColor:'var(--good)'}}>
                      <span className="label" style={{color:'#a8d17a'}}>&#9733; Engine's Top Choice</span>
                      <span className="value" style={{fontSize:13}}>You found the best move in this position!</span>
                    </div>
                  ) : (
                    <div className="stat-box" style={{gridColumn:'1 / -1'}}>
                      <span className="label">Best Alternative</span>
                      <span className="value">{analysis.best_alternative}</span>
                    </div>
                  )}
                </div>
                <div>
                  <span className="label" style={{fontSize:10, textTransform:'uppercase', color:'var(--brass)'}}>Motifs Triggered</span><br/>
                  {(!analysis.motifs || analysis.motifs.length===0) && <span style={{fontSize:12, color:'var(--brass)'}}>none</span>}
                  {analysis.motifs && analysis.motifs.map(m => <span key={m} className="motif-chip">{MOTIF_LABELS[m]||m}</span>)}
                </div>
              </React.Fragment>
            )}
          </div>

          <div className="panel">
            <h3>Engine Personality</h3>
            {(!engineState || !engineState.sliders || engineState.sliders.every(v=>v===0)) ? (
              <div style={{fontSize:12, color:'var(--brass)'}}>Finish a full game to calibrate the engine to your weaknesses.</div>
            ) : (
              <React.Fragment>
                {SLIDER_META.map(s=>{
                  const val = engineState.sliders[s.key] ?? 0;
                  const pct = Math.max(0, Math.min(100, ((val+1)/2)*100));
                  return (
                    <div key={s.key} style={{marginBottom:10}}>
                      <div style={{display:'flex', justifyContent:'space-between', fontSize:11, color:'var(--brass)'}}>
                        <span>{s.icon} {s.label}</span><span>{val.toFixed(2)}</span>
                      </div>
                      <div style={{height:6, background:'var(--wood-900)', borderRadius:3, border:'1px solid var(--wood-700)'}}>
                        <div style={{height:'100%', width:pct+'%', background:'linear-gradient(90deg, var(--wood-600), var(--brass-bright))', borderRadius:3}}></div>
                      </div>
                    </div>
                  );
                })}
                {engineState.engine_config && (
                  <div style={{fontSize:11, color:'var(--brass)', marginTop:6}}>
                    Stockfish skill {engineState.engine_config.skill_level} &middot; ~{engineState.engine_config.uci_elo} Elo
                  </div>
                )}
              </React.Fragment>
            )}
          </div>
        </div>
      </div>

      

      {showProfile && (
        <div className="modal-backdrop" onClick={()=>setShowProfile(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <button className="btn btn-ghost modal-close" onClick={()=>setShowProfile(false)}>Close</button>
            <h2 style={{marginTop:0}}>Your Training Cockpit</h2>
            {!profileData && <div>Loading...</div>}
            {profileData && (
              <React.Fragment>
                <div className="elo-hero">
                  <span className="num">{Math.round(profileData.elo)}</span>
                  <span style={{color:'var(--brass)'}}>current rating</span>
                </div>

                <h3>Progress Timeline</h3>
                <TimelineChart timeline={profileData.timeline} />

                <h3>Bad Habit Heatmap</h3>
                {[...profileData.heatmap].sort((a,b)=>b.score-a.score).map(h=>(
                 <div className="heat-row" key={h.motif}>
                    <span className="heat-label">{MOTIF_LABELS[h.motif]||h.motif}</span>
                    <div className="heat-bar-track">
                      <div className="heat-bar-fill" style={{width:(Math.min(100, h.score*100))+'%'}}></div>
                    </div>
                  </div>
                ))}

                <h3>Homework</h3>
                {(!profileData.homework || profileData.homework.length===0) && (
                  <div style={{fontSize:13, color:'var(--brass)'}}>No homework yet - play a full game to generate your study plan.</div>
                )}
                {profileData.homework && profileData.homework.map(m=>(
                  <div className="homework-card" key={m}>
                    <b>{MOTIF_LABELS[m]||m}</b><br/>{HOMEWORK_TIPS[m] || 'Keep an eye on this pattern in your next games.'}
                    <br/>
                    <a href={LICHESS_THEME_MAP[m] || 'https://lichess.org/training'} target="_blank" rel="noopener noreferrer"
                      style={{color:'var(--brass-bright)', fontSize:12, textDecoration:'underline'}}>
                      Practice these puzzles on Lichess &rarr;
                    </a>
                  </div>
                ))}

                <h3>Past Games</h3>
                {gamesList.length===0 && <div style={{fontSize:13, color:'var(--brass)'}}>No games played yet.</div>}
                {gamesList.map(g=>(
                  <div key={g.game_id} className="homework-card" style={{cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center'}}
                    onClick={()=>openGameReview(g.game_id)}>
                    <span>
                      <b>Game #{g.game_id}</b><br/>
                      <span style={{fontSize:11, color:'var(--brass)'}}>{new Date(g.played_at).toLocaleString()}</span>
                    </span>
                    <span style={{textAlign:'right', fontSize:12}}>
                      {g.accuracy_pct!=null && <div>{Math.round(g.accuracy_pct*100)}% accuracy</div>}
                      {g.acpl!=null && <div style={{color:'var(--brass)'}}>ACPL {g.acpl.toFixed(1)}</div>}
                      {g.elo_after!=null && <div style={{color:'var(--brass-bright)'}}>Elo {Math.round(g.elo_after)}</div>}
                    </span>
                  </div>
                ))}
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function TimelineChart({timeline}){
  if(!timeline || timeline.length===0) return <div style={{fontSize:13, color:'var(--brass)', marginBottom:14}}>Play full games to build your timeline.</div>;
  const w = 680, h = 170, padL = 42, padR = 16, padT = 14, padB = 28;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = timeline.length;
  const xFor = i => padL + (n<=1 ? plotW/2 : i*plotW/(n-1));
  const yFor = pct => padT + plotH - (pct * plotH);
  const points = timeline.map((g,i)=> xFor(i)+','+yFor(g.accuracy_pct||0)).join(' ');
  const yTicks = [0, 0.25, 0.5, 0.75, 1.0];
  return (
    <svg width={w} height={h} style={{background:'#1a0f08', borderRadius:8, marginBottom:16}}>
      {/* gridlines + y-axis labels (accuracy %) */}
      {yTicks.map(t=>(
        <g key={t}>
          <line x1={padL} x2={w-padR} y1={yFor(t)} y2={yFor(t)} stroke="#3a2414" strokeWidth="1" />
          <text x={padL-8} y={yFor(t)+4} fontSize="10" fill="#cda254" textAnchor="end">{Math.round(t*100)}%</text>
        </g>
      ))}
      {/* x-axis labels (game number) */}
      {timeline.map((g,i)=>{
        if(n>12 && i % Math.ceil(n/12) !== 0) return null;
        return <text key={i} x={xFor(i)} y={h-8} fontSize="10" fill="#cda254" textAnchor="middle">#{i+1}</text>;
      })}
      <line x1={padL} x2={padL} y1={padT} y2={h-padB} stroke="#7a4c28" strokeWidth="1.5" />
      <line x1={padL} x2={w-padR} y1={h-padB} y2={h-padB} stroke="#7a4c28" strokeWidth="1.5" />
      <text x={padL-30} y={padT-2} fontSize="10" fill="#9c6633">Accuracy</text>
      <polyline points={points} fill="none" stroke="#cda254" strokeWidth="2.5" />
      {timeline.map((g,i)=>(
        <circle key={i} cx={xFor(i)} cy={yFor(g.accuracy_pct||0)} r="3.5" fill="#e7c579">
          <title>{'Game #'+(i+1)+': '+Math.round((g.accuracy_pct||0)*100)+'% accuracy'}</title>
        </circle>
      ))}
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
